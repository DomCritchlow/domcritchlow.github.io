name: Add Photo to Gallery

on:
  repository_dispatch:
    types: [add-photo]

jobs:
  add-photo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install sharp
      
      - name: Process and save image
        run: |
          node .github/scripts/process-photo.js
        env:
          IMAGE_DATA: ${{ github.event.client_payload.image_data }}
          IMAGE_NAME: ${{ github.event.client_payload.image_name }}
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/gallery/ public/gallery-thumbs/
          git diff --staged --quiet || git commit -m "Add photo: ${{ github.event.client_payload.image_name }}"
          git push

