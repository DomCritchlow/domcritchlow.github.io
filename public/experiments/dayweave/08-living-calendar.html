/* Layout: one app window on a quiet ground. The pill floats at the bottom center of the calendar; scene notes sit below. */
:root{
 --ground:#e9ece5; --paper:#f8f9f5; --paper-2:#f1f3ed; --ink:#1d2a23; --ink-2:#56645b; --ink-3:#8a968d;
 --line:#e0e5db; --line-2:#cbd4c6; --accent:#2f5a45; --accent-ink:#ffffff; --accent-soft:#dfeadf;
 --amber:#b97a1f; --amber-soft:#f6ead3; --now:#d0603a;
 --internal:#2f72ad; --internal-bg:#e2ecf5; --external:#c0612a; --external-bg:#f7e8dd; --solo:#7652ad; --solo-bg:#ece6f5;
 --free:#2f8a5f; --free-bg:rgba(47,138,95,.09); --free-line:rgba(47,138,95,.55);
 --tok-when:#d9ebdc; --tok-when-line:#3f8a5c; --tok-long:#f5e6c7; --tok-long-line:#b97a1f; --tok-what:#dbe7f3; --tok-what-line:#2f72ad;
 --shadow-sm:0 1px 2px rgba(29,42,35,.06),0 2px 8px rgba(29,42,35,.05);
 --shadow:0 1px 2px rgba(29,42,35,.06),0 12px 32px rgba(29,42,35,.12);
 --shadow-lift:0 2px 4px rgba(29,42,35,.08),0 16px 36px rgba(29,42,35,.18);
 --dawn:#f7efd9; --noon:#f8f9f5; --dusk:#e6e9f1;
 --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --font-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --t-cap:11px; --t-small:12.5px; --t-body:13.5px; --t-input:16px; --t-lead:17px; --t-title:26px;
 --spring:cubic-bezier(.2,.9,.25,1);
 --spring:linear(0,.06 2.5%,.22 6%,.45 11%,.68 17%,.85 24%,.95 31%,1.01 39%,1.03 47%,1.025 55%,1.01 66%,1.002 80%,1);
}

html,body{height:auto}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:var(--t-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:8px}
button:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* Study bar */
.study-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:30px;height:30px;color:var(--accent);flex:none}
.brand strong{font-family:var(--font-display);font-size:19px;font-weight:650;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{color:var(--ink-2);font-size:var(--t-small)}
.tabs{display:flex;gap:2px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:var(--t-small)}
.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
.scenes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scenes button{border:1px solid var(--line-2);background:var(--paper);padding:6px 11px;border-radius:999px;font-size:var(--t-small);font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.scenes button b{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.scenes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scenes button[aria-pressed="true"] b{color:var(--paper);opacity:.6}
.scenes .replay{border-style:dashed}

/* App window */
.app{position:relative;height:min(820px,calc(100vh - 120px));min-height:600px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.app-top{display:flex;align-items:center;gap:14px;padding:14px 18px 10px;flex-wrap:wrap}
.app-top h1{font-family:var(--font-display);font-size:var(--t-title);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1;font-variation-settings:"opsz" 48}
.app-top .sub{color:var(--ink-2);font-size:var(--t-small)}
.app-nav{display:flex;gap:2px;align-items:center}
.app-nav button{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.app-nav button:hover{background:var(--paper-2)}
.app-nav .today{width:auto;padding:0 10px;font-size:var(--t-small);font-weight:600;border:1px solid var(--line-2);height:28px}
.app-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.views{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--paper-2)}
.views button{padding:4px 10px;font-size:var(--t-small);font-weight:600;color:var(--ink-2);border-radius:8px}
.views button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
.source-chip{display:flex;align-items:center;gap:6px;font-size:var(--t-small);color:var(--ink-2);border:1px solid var(--line);padding:4px 10px;border-radius:999px;background:var(--paper)}
.source-chip i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}

/* Calendar */
.cal{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.row{display:flex;min-width:0}
.axis{flex:0 0 54px}
.col{flex:1 1 0;min-width:0;transition:flex-grow .62s var(--spring)}
.head .col{padding:4px 10px 8px;display:flex;align-items:baseline;gap:6px;border-left:1px solid transparent;overflow:hidden;white-space:nowrap}
.head .col span{color:var(--ink-2);font-size:var(--t-small);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.head .col strong{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.head .col.today strong{color:var(--accent)}

for(const [i,[n,d]] of DAYS.entries()){
 const h=document.createElement('div');h.className='col'+(i===NOW.day?' today':'');h.innerHTML=`<span>${n}</span><strong>${d}</strong>`;head.append(h);heads.push(h);
 const t=document.createElement('div');t.className='track col';t.dataset.day=i;body.append(t);tracks.push(t);
}
const nowEl=document.createElement('div');nowEl.className='now';nowEl.innerHTML=`<span>${clock(NOW.m)}</span>`;tracks[NOW.day].append(nowEl);
const linkSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');linkSvg.classList.add('link');body.append(linkSvg);

let S,gen=0;
const blankView=()=>({focusDays:[],ranges:[],lit:new Map(),free:[],target:null});
function reset(){
 gen++;S={events:BASE.map(e=>({...e})),settled:blankView(),preview:null,proposal:null,answer:null,noticed:null,memoryOpen:false,memory:MEMORY.map(m=>({...m})),thinking:false,status:'',history:[],skip:null,dictating:false,holdCount:0};
 input.value='';autosize();pill.classList.remove('thinking','listening');linkSvg.innerHTML='';

/* ---------- time and day geometry ---------- */
function scale(ranges){
 const bands=[];for(let a=FROM;a<TO;a+=30){const near=ranges.some(([s,e])=>a<e&&a+30>s);bands.push({a,w:ranges.length?(near?1.9:.5):1});}
 const total=bands.reduce((t,b)=>t+b.w,0);let acc=0;for(const b of bands){b.y=acc/total;b.h=b.w/total;acc+=b.w;}
 return v=>{if(v<=FROM)return 0;if(v>=TO)return 1;const b=bands[Math.min(bands.length-1,Math.floor((v-FROM)/30))];return b.y+(v-b.a)/30*b.h;};
}
function weights(focus){
 if(phone.matches){const set=focus.length&&focus.length<5?focus:[NOW.day];return DAYS.map((_,i)=>set.includes(i)?1:(set.length>=3?.5:.28));}
 if(!focus.length||focus.length===5)return DAYS.map(()=>1);
 return DAYS.map((_,i)=>focus.includes(i)?2.3:.75);
}
function busy(day,skip){return S.events.filter(e=>e.day===day&&!e.declined&&e.id!==skip).map(e=>[e.s,e.e]).sort((a,b)=>a[0]-b[0]);}

 for(const [s,e] of busy(day,skip)){if(e<=t)continue;if(s>=b)break;if(s-t>=min)out.push({day,s:t,e:s});t=Math.max(t,e);}
 if(b-t>=min)out.push({day,s:t,e:b});return out;
}

/* ---------- local parser: unambiguous words only, never a decision ---------- */
const PARTS={morning:[540,720],afternoon:[720,1080],'late afternoon':[900,1080],evening:[1020,1080],lunch:[720,780],lunchtime:[720,780],'end of day':[960,1080]};
const KEYS=[['project review',['review']],['the review',['review']],['design exchange',['exchange']],['standups',['stand1','stand2','stand3','stand4']],['standup',['stand1','stand2','stand3','stand4']],['vendor demo',['vendor']],['vendor',['vendor']],['customer call',['customer']],['1:1 with sam',['sam']],['sam',['sam']],['all hands',['allhands']],['all-hands',['allhands']],['board prep',['board']],['writing time',['writing']],['research block',['research']],['studio check-in',['checkin']],['check-in',['checkin']],['hiring loop',['hiring']],['weekly reflection',['reflect']],['office hours',['office']],['studio sync',['studio0']],['morning notes',['notes']]];
const NUM={a:1,an:1,one:1,two:2,three:3,four:4,half:.5,'1':1,'2':2,'3':3,'4':4,'1.5':1.5};
const MIN={fifteen:15,thirty:30,'forty five':45,'forty-five':45,fortyfive:45,sixty:60,ninety:90};
function parse(text){
 const t=text.toLowerCase().replaceAll('’',"'");const tokens=[];
 const add=(re,kind,fn)=>{for(const m of t.matchAll(re))tokens.push({start:m.index,end:m.index+m[0].length,kind,...fn(m)});};
 add(/\b(mon|tues|wednes|thurs|fri)day\b/g,'when',m=>({day:['mon','tues','wednes','thurs','fri'].indexOf(m[1]),label:FULL[['mon','tues','wednes','thurs','fri'].indexOf(m[1])]}));
 add(/\btoday\b/g,'when',()=>({day:0,label:'Today'}));add(/\btomorrow\b/g,'when',()=>({day:1,label:'Tomorrow'}));
 add(/\b(this week|the week|next few days)\b/g,'when',()=>({week:true,label:'This week'}));
 add(/\b(late afternoon|end of day|morning|afternoon|evening|lunchtime)\b/g,'when',m=>({part:PARTS[m[1]],label:m[1][0].toUpperCase()+m[1].slice(1)}));
 add(/\b(an?|one|two|three|four|half an?|1\.5|[1-4])\s*-?\s*(hours?|hrs?|h)\b(\s+and a half)?/g,'long',m=>{const n=NUM[m[1].split(' ')[0]]??1;const v=Math.round((n+(m[3]?.5:0))*60);return {minutes:v,label:dur(v)};});
 add(/\b(\d{2,3}|fifteen|thirty|forty[- ]?five|sixty|ninety)\s*(minutes?|mins?|m)\b/g,'long',m=>{const v=MIN[m[1]]??+m[1];return {minutes:v,label:dur(v)};});
 add(/\b(?:at\s+)?(\d{1,2})(?::(\d\d))?\s*(am|pm)\b|\bat\s+(\d{1,2})(?::(\d\d))?\b|\bnoon\b/g,'when',m=>{let h,mm;if(m[0]==='noon'){h=12;mm=0;}else if(m[3]){h=+m[1]%12+(m[3]==='pm'?12:0);mm=+(m[2]||0);}else{h=+m[4];mm=+(m[5]||0);if(h<8)h+=12;}return {time:h*60+mm,label:clock(h*60+mm)};});
 for(const [k,ids] of KEYS){let i=t.indexOf(k);while(i>=0){if((i===0||/\W/.test(t[i-1]))&&(i+k.length===t.length||/\W/.test(t[i+k.length])))tokens.push({start:i,end:i+k.length,kind:'what',ids,label:ids.length>1?k[0].toUpperCase()+k.slice(1):BASE.find(e=>e.id===ids[0]).title});i=t.indexOf(k,i+1);}}
 const acts=[[/\b(move|moving|reschedule|push|shift|bump)\b/g,'move','Move'],[/\b(skip|cancel|drop|miss|decline)\b/g,'skip','Skip'],[/\b(find|free time|open time|time for|block|hold|carve out)\b/g,'find','Find time'],[/\b(keep)\b/g,'keep','Keep'],[/\b(what's on|what is on|show|when is|what do i have)\b/g,'show','Show']];
 for(const [re,intent,label] of acts)add(re,'act',()=>({intent,label}));
 tokens.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));
 const kept=[];for(const tok of tokens)if(!kept.some(k=>tok.start<k.end&&tok.end>k.start))kept.push(tok);
 const p={text,tokens:kept,days:[],part:null,minutes:null,time:null,ids:[],intent:null,week:false,title:null};
 for(const tok of kept){if(tok.day!==undefined&&!p.days.includes(tok.day))p.days.push(tok.day);if(tok.part)p.part=tok.part;if(tok.minutes)p.minutes=tok.minutes;if(tok.time!==undefined)p.time=tok.time;if(tok.ids)p.ids.push(...tok.ids.filter(id=>!p.ids.includes(id)));if(tok.week)p.week=true;if(tok.intent&&!p.intent)p.intent=tok.intent;}
 const trimmed=t.trim().replace(/[.!?]+$/,'');
 if(/^(yes|yep|yeah|do it|go ahead|confirm|sounds good|ok|okay|perfect|great)\b/.test(trimmed))p.intent='confirm';
 else if(/^undo\b/.test(trimmed))p.intent='undo';
 else if(/what do you know|memory|what have you learned|about me/.test(trimmed))p.intent='memory';
 else if(/^(clear|reset|never ?mind|back to (the )?week|start over)$/.test(trimmed))p.intent='clear';
 const title=t.match(/\bfor (?!the\b|a\b|an\b)([a-z][a-z ]{2,24}?)(?=\s+(?:on|this|next|in|at|monday|tuesday|wednesday|thursday|friday|today|tomorrow|morning|afternoon)\b|[.?!]?$)/);
 if(title)p.title=title[1][0].toUpperCase()+title[1].slice(1);
 if(!p.intent&&p.minutes)p.intent='find';
 if(p.intent==='move'){const dest=kept.filter(k=>k.day!==undefined).at(-1);p.dest=dest?dest.day:null;}

}
function eventById(id){return S.events.find(e=>e.id===id);}
function slotFor(ev,day,part,time){
 const len=ev.e-ev.s;
 if(time!=null){const ok=windows(day,[time,time+len],len,ev.id).length;return {day,s:time,e:time+len,conflict:!ok};}
 const w=windows(day,part||[540,1080],len,ev.id)[0];
 return w?{day,s:w.s,e:w.s+len}:null;
}
function alternatives(ev,first){
 const out=[];
 for(const day of [first.day,Math.min(4,first.day+1)]){
  for(const w of windows(day,[780,1080],ev.e-ev.s,ev.id)){const s={day,s:w.s,e:w.s+ev.e-ev.s};if(!(s.day===first.day&&s.s===first.s)&&!out.some(o=>o.day===s.day))out.push(s);break;}
 }
 return out.slice(0,2);
}

/* ---------- preview from the draft (no model, no proposal) ---------- */
function previewFor(p){
 const v=blankView();
 if(p.intent==='move'&&p.ids.length){
  const ev=eventById(p.ids.find(id=>eventById(id).day===p.dest)||p.ids[0]);v.focusDays=[ev.day];v.ranges=[[ev.s,ev.e]];v.lit.set(ev.id,'');
  if(p.dest!=null&&!(p.dest===ev.day&&!p.part&&p.time==null)){const slot=slotFor(ev,p.dest,p.part,p.time);if(!v.focusDays.includes(p.dest))v.focusDays.push(p.dest);if(slot){v.target={...slot,label:'Could go here'};v.ranges.push([slot.s,slot.e]);}else if(p.part)v.ranges.push(p.part);}
  return v;
 }
 if(p.intent==='find'||(p.minutes&&!p.ids.length)){
  const days=p.days.length?p.days:[0,1,2,3,4];v.focusDays=p.days.length?days:[];
  if(p.part)v.ranges=[p.part];
  v.free=days.flatMap(d=>windows(d,p.part||[540,1080],p.minutes||30));
  return v;
 }
 if(p.ids.length){for(const id of p.ids){const e=eventById(id);v.lit.set(id,'');if(!v.focusDays.includes(e.day))v.focusDays.push(e.day);v.ranges.push([e.s,e.e]);}if(v.focusDays.length>=4)v.focusDays=[];return v;}
 if(p.days.length){v.focusDays=[...p.days];if(p.part)v.ranges=[p.part];for(const e of S.events)if(p.days.includes(e.day)&&(!p.part||(e.s<p.part[1]&&e.e>p.part[0])))v.lit.set(e.id,'');return v;}
 if(p.part){v.ranges=[p.part];return v;}
 return null;
}

/* ---------- rendering ---------- */
function view(){return S.preview||S.settled;}
function render(){
 const v=view(),w=weights(v.focusDays),y=scale(v.ranges),H=body.clientHeight||600;
 heads.forEach((h,i)=>{h.style.flexGrow=w[i];h.classList.toggle('focus',v.focusDays.includes(i)&&v.focusDays.length<5);});
 tracks.forEach((t,i)=>{t.style.flexGrow=w[i];t.classList.toggle('focus',v.focusDays.includes(i)&&v.focusDays.length<5);});
 let last=-99;
 for(let h=8;h<=18;h++){
  let label=hourEls.get(h),rule=ruleEls.get(h);
  if(!label){label=document.createElement('span');label.className='hour';label.textContent=h===12?'Noon':`${h%12||12} ${h<12?'AM':'PM'}`;axis.append(label);hourEls.set(h,label);
   rule=document.createElement('i');rule.className='rule';body.append(rule);ruleEls.set(h,rule);rule.style.left=getComputedStyle(axis).flexBasis;}
  const top=y(h*60),px=top*H,show=px-last>=17&&h>8&&h<18;
  label.style.top=top*100+'%';label.style.opacity=show?1:0;if(show)last=px;
  rule.style.top=top*100+'%';rule.style.opacity=h>8&&h<18?1:0;
 }
 nowEl.style.top=y(NOW.m)*100+'%';
 const seen=new Set(),dimOthers=v.lit.size>0||!!S.proposal;
 const proposed=S.proposal;
 for(const e of S.events){
  const lit=v.lit.has(e.id)||(proposed?.kind==='decline'&&proposed.ids.includes(e.id));
  const classes=['ev',e.cat];
  if(e.day===NOW.day&&e.e<=NOW.m)classes.push('past');
  if(e.declined)classes.push('declined');
  if(proposed?.kind==='move'&&proposed.id===e.id)classes.push('ghost');
  else if(lit)classes.push('lit');
  else if(dimOthers)classes.push('dim');
  if(proposed?.kind==='decline'&&proposed.ids.includes(e.id))classes.push('declining');
  place(e.id,e,classes,y,H,{why:v.lit.get(e.id)||'',label:proposed?.kind==='move'&&proposed.id===e.id?'Now · '+e.title:e.title});seen.add(e.id);
 }
 if(proposed?.kind==='move'){const e=eventById(proposed.id);place('p:'+e.id,{...e,day:proposed.day,s:proposed.s,e:proposed.e},['ev',e.cat,'proposed'],y,H,{label:e.title,tag:'Proposed',facts:proposed.facts});seen.add('p:'+e.id);}
 if(proposed?.kind==='hold'){place('p:hold',{id:'p:hold',cat:'solo',day:proposed.day,s:proposed.s,e:proposed.e,title:proposed.title},['ev','solo','proposed'],y,H,{label:proposed.title,tag:'New hold',facts:proposed.facts});seen.add('p:hold');}
 if(v.target){const t=v.target;place('target',{day:t.day,s:t.s,e:t.e,title:t.label},['ev','target'],y,H,{label:t.label});seen.add('target');}
 for(const f of v.free){const key=`free:${f.day}:${f.s}`;let el=els.get(key);
  if(!el){el=document.createElement('button');el.className='free';el.dataset.key=key;tracks[f.day].append(el);els.set(key,el);el.addEventListener('click',()=>chooseWindow(f));}
  el.innerHTML=`<span>${dur(f.e-f.s)} open</span><small>${span(f.s,f.e)}</small>`;el.style.top=y(f.s)*100+'%';el.style.height=`calc(${(y(f.e)-y(f.s))*100}% - 2px)`;seen.add(key);}
 for(const [key,el] of els)if(!seen.has(key)){el.remove();els.delete(key);}
 pill.classList.toggle('thinking',S.thinking);
 renderStack();renderGo();
 clearTimeout(render.link);linkSvg.innerHTML='';if(proposed?.kind==='move')render.link=setTimeout(drawLink,reduce.matches?0:700);
}
function place(key,e,classes,y,H,{why='',label,tag='',facts=[]}){
 let el=els.get(key),fresh=false;
 if(!el){el=document.createElement('button');el.dataset.key=key;el.type='button';el.addEventListener('click',()=>eventClick(key));els.set(key,el);fresh=true;}
 const parent=tracks[e.day];let before=null;
 if(el.parentElement!==parent){if(!fresh)before=el.getBoundingClientRect();parent.append(el);}
 const px=(y(e.e)-y(e.s))*H;if(px<40&&!classes.includes('proposed'))classes.push('short');
 el.className=classes.join(' ');
 const html=`<i class="dot"></i>${tag?`<span class="tag">${esc(tag)}</span>`:''}<b>${esc(label)}</b><span class="t">${span(e.s,e.e)}</span><span class="why">${esc(why)}</span>${facts.length?`<span class="facts">${facts.map(f=>`<span class="fact ${f.cls||''}">${esc(f.text)}</span>`).join('')}</span>`:''}`;
 if(el.dataset.html!==html){el.innerHTML=html;el.dataset.html=html;}
 el.style.top=y(e.s)*100+'%';el.style.height=`calc(${(y(e.e)-y(e.s))*100}% - 2px)`;
 el.setAttribute('aria-label',`${label}, ${FULL[e.day]} ${span(e.s,e.e)}${why?'. '+why:''}`);
 if(before&&!reduce.matches){const after=el.getBoundingClientRect();fly(el,before,after);}

}
function fly(el,from,to){
 if(reduce.matches||!to.width)return;
 const dx=from.left-to.left,dy=from.top-to.top,sx=from.width/to.width,sy=from.height/to.height,lift=-Math.min(90,Math.abs(dx)*.16+28);
 el.style.transformOrigin='0 0';
 el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transform:`translate(${dx*.45}px,${dy*.45+lift}px) scale(${(sx+1)/2*1.03},${(sy+1)/2*1.03})`,offset:.5},{transform:'none'}],{duration:760,easing:'cubic-bezier(.3,.7,.2,1)'});
}
function drawLink(){
 const g=els.get(S.proposal?.kind==='move'?S.proposal.id:''),p=els.get(S.proposal?.kind==='move'?'p:'+S.proposal.id:'');
 if(!g||!p)return;const b=body.getBoundingClientRect(),a=g.getBoundingClientRect(),c=p.getBoundingClientRect();
 const x1=a.left+a.width/2-b.left,y1=a.top+a.height/2-b.top,x2=c.left+c.width/2-b.left,y2=c.top+4-b.top,lift=Math.max(40,Math.abs(x2-x1)*.25);
 linkSvg.innerHTML=`<path d="M${x1} ${y1} C ${x1} ${y1-lift}, ${x2} ${y2-lift}, ${x2} ${y2}"/>`;
 const path=linkSvg.firstChild;if(reduce.matches)return;const len=path.getTotalLength();path.style.strokeDasharray='4 5';path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:600,easing:'ease-out'});
}

/* ---------- pill: highlighting, parsed chips, status ---------- */
function renderInput(){
 const p=parse(input.value);let html='',i=0;
 for(const tok of p.tokens){html+=esc(input.value.slice(i,tok.start))+`<mark class="${tok.kind}">${esc(input.value.slice(tok.start,tok.end))}</mark>`;i=tok.end;}
 mirror.innerHTML=html+esc(input.value.slice(i))+' ';
 if(S.thinking){meta.innerHTML=`<span class="status"><b>${esc(S.status)}</b></span>`;return p;}
 const chips=[];if(S.dictating)chips.push('<span class="pchip dict">Dictation</span>');
 const seen=new Set();for(const tok of p.tokens){const key=tok.kind+tok.label;if(seen.has(key))continue;seen.add(key);chips.push(`<span class="pchip ${tok.kind}">${esc(tok.label)}</span>`);}
 if(p.intent==='confirm'&&S.proposal)chips.push('<span class="pchip act">Confirms the change shown</span>');
 meta.innerHTML=input.value.trim()?chips.join(''):'';
 return p;
}
function autosize(){input.style.height='40px';input.style.height=Math.min(96,Math.max(40,input.scrollHeight))+'px';}
function onInput(){
 autosize();const p=renderInput();
 if(S.thinking)return;
 const next=input.value.trim()&&p.meaningful&&!['confirm','keep'].includes(p.intent)?previewFor(p):null;
 S.preview=next;render();
}
function renderGo(){
 const label=S.proposal&&!input.value.trim()?S.proposal.cta:'';
 go.classList.toggle('labelled',!!label);
 go.innerHTML=label?`${esc(label)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
 go.setAttribute('aria-label',label||'Send');
}
function renderStack(){
 const parts=[];
 if(S.noticed)parts.push(`<div class="card noticed" data-k="n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M4.2 7l1.7 1M18.1 16l1.7 1M3 12h2M19 12h2M4.2 17l1.7-1M18.1 8l1.7-1"/><circle cx="12" cy="12" r="3.5"/></svg><div><span class="eyebrow">Noticed</span><p>${S.noticed}</p><div class="chips"><button class="chip primary" data-act="remember">Remember this</button><button class="chip" data-act="once">Just this time</button></div></div></div>`);
 if(S.memoryOpen)parts.push(`<div class="card memory" data-k="m"><h3>What Dayweave knows</h3><p class="sub">These shape answers. None of them change your calendar.</p><ul>${S.memory.map((m,i)=>`<li class="${m.new?'new':''}"><p>${esc(m.text)}<small>${esc(m.sub)}</small></p><span class="badge ${m.kind}">${{learned:'Learned',said:'You said',grok:'Grok'}[m.kind]}</span><button data-act="forget:${i}" aria-label="Forget ${esc(m.text)}">Forget</button></li>`).join('')}</ul></div>`);
 if(S.answer&&!S.memoryOpen)parts.push(`<div class="card answer" data-k="a">${S.answer.lead?`<p class="lead">${S.answer.lead}</p>`:''}${S.answer.more?`<p class="more">${S.answer.more}</p>`:''}${S.answer.chips?.length?`<div class="chips">${S.answer.chips.map(c=>`<button class="chip ${c.primary?'primary':''}" data-act="${esc(c.act)}">${esc(c.label)}${c.small?` <small>${esc(c.small)}</small>`:''}${c.key?` <kbd>${c.key}</kbd>`:''}</button>`).join('')}</div>`:''}</div>`);

  const keys=[...stack.children].map(c=>c.dataset.k+c.innerHTML.length);
  stack.innerHTML=html;stack.dataset.html=html;
  [...stack.children].forEach((c,i)=>{if(keys.includes(c.dataset.k+c.innerHTML.length)||keys[i]?.[0]===c.dataset.k)c.style.animation='none';});
 }
}

/* ---------- requests ---------- */
async function think(steps,g){
 S.thinking=true;S.preview=null;
 for(const [text,ms] of steps){S.status=text;renderInput();render();await sleep(ms);if(g!==gen)return false;}
 S.thinking=false;S.status='';renderInput();return true;
}
function bold(s){return `<em>${esc(s)}</em>`;}
async function submit(raw){
 const text=raw.trim();if(!text){if(S.proposal)return confirm();input.focus();return;}
 const p=parse(text),g=gen;
 input.value='';autosize();S.dictating=false;pill.classList.remove('listening');renderInput();
 if(p.intent==='confirm'){S.preview=null;if(S.proposal)return confirm();S.answer={lead:'There is nothing waiting for a yes. Ask for a change first.'};renderInput();return render();}
 if(p.intent==='undo')return undo();
 if(p.intent==='memory'){S.preview=null;S.memoryOpen=true;S.answer=null;renderInput();return render();}
 if(p.intent==='clear'){S.preview=null;S.settled=blankView();S.proposal=null;S.answer=null;S.memoryOpen=false;S.skip=null;renderInput();return render();}

 async free(){input.focus();},
};
function play(name){
 current=name;const id=++run;reset();renderNotes(name);
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===name)));
 SCENES[name](id).catch(e=>{if(e!=='cancel')console.error(e);});
}
function takeOver(e){if(e?.isTrusted&&current!=='free'){run++;current='free';document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene==='free')));renderNotes('free');}}
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.scene)));
$('#replay').addEventListener('click',()=>play(current));
input.addEventListener('pointerdown',takeOver);input.addEventListener('keydown',e=>{if(e.key.length===1)takeOver(e);});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});phone.addEventListener('change',render);
const zone=$('#zone');new ResizeObserver(()=>{const r=Math.round(Math.min(zone.offsetHeight+28,app.clientHeight*.4));const cur=parseFloat(app.style.getPropertyValue('--reserve'))||0;if(Math.abs(cur-r)>4){app.style.setProperty('--reserve',r+'px');clearTimeout(rt);rt=setTimeout(render,480);}}).observe(zone);
window.__proto={play,get state(){return S;}};

/* ---------- tabs ---------- */
function route(){
 const h=decodeURIComponent(location.hash.slice(1));let name='prototype',target=null;
 if(['prototype','review','research'].includes(h))name=h;
 else if(h){target=document.getElementById(h);const v=target?.closest('[id^="view-"]');if(v)name=v.id.slice(5);}
 for(const v of ['prototype','review','research']){const el=$('#view-'+v);if(el)el.hidden=v!==name;}
 document.querySelectorAll('[data-tab]').forEach(a=>{if(a.dataset.tab===name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(name==='prototype')requestAnimationFrame(render);
 if(target)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));else if(name!=='prototype')scrollTo(0,0);
}
addEventListener('hashchange',route);route();
play('speak');
})();
